name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libsdl2-dev libsdl2-ttf-dev
      - name: Build
        run: |
          cmake -S port -B port/build -DCMAKE_BUILD_TYPE=Release
          cmake --build port/build -j 4 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Report compiler errors
        if: failure()
        run: grep -E "error|warning|undefined reference|multiple definition" build.log | head -50 | sed 's/^/::error::/' || true
      - name: Package
        run: |
          mkdir -p dist/a2racer
          cp port/build/a2racer port/README.md dist/a2racer/
          tar -C dist -czf a2racer-linux-x86_64.tar.gz a2racer
      - uses: actions/upload-artifact@v4
        with:
          name: a2racer-linux-x86_64
          path: a2racer-linux-x86_64.tar.gz

  macos:
    runs-on: macos-14
    env:
      SDL2_VERSION: 2.30.9
      SDL2_TTF_VERSION: 2.22.0
    steps:
      - uses: actions/checkout@v4
      # Homebrew's sdl2 is now sdl2-compat, which loads SDL3 at run time; building SDL2
      # and SDL2_ttf (with its own FreeType) as static libraries gives one self-contained
      # universal executable instead.
      - name: SDL2 and SDL2_ttf, static and universal
        run: |
          curl -sSfL -o sdl.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz
          curl -sSfL -o ttf.tar.gz https://github.com/libsdl-org/SDL_ttf/releases/download/release-$SDL2_TTF_VERSION/SDL2_ttf-$SDL2_TTF_VERSION.tar.gz
          tar xzf sdl.tar.gz
          tar xzf ttf.tar.gz
          common=(-DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_INSTALL_PREFIX=$PWD/deps -DCMAKE_PREFIX_PATH=$PWD/deps)
          cmake -S SDL2-$SDL2_VERSION -B sdl-build "${common[@]}" -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF
          cmake --build sdl-build -j 4
          cmake --install sdl-build
          cmake -S SDL2_ttf-$SDL2_TTF_VERSION -B ttf-build "${common[@]}" -DBUILD_SHARED_LIBS=OFF -DSDL2TTF_VENDORED=ON -DSDL2TTF_HARFBUZZ=OFF -DSDL2TTF_SAMPLES=OFF
          cmake --build ttf-build -j 4
          cmake --install ttf-build
      - name: Build
        run: |
          cmake -S port -B port/build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_PREFIX_PATH=$PWD/deps
          cmake --build port/build -j 4 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Report compiler errors
        if: failure()
        run: grep -E "error|warning|undefined|Undefined" build.log | head -50 | sed 's/^/::error::/' || true
      - name: Package
        run: |
          otool -L port/build/a2racer
          if otool -L port/build/a2racer | grep -E "SDL|freetype|/opt/homebrew|/usr/local"; then echo "::error::links a non-system library"; exit 1; fi
          lipo -info port/build/a2racer
          mkdir -p dist/a2racer
          cp port/build/a2racer port/README.md dist/a2racer/
          codesign --force --sign - dist/a2racer/a2racer
          (cd dist && zip -r ../a2racer-macos-universal.zip a2racer)
      - uses: actions/upload-artifact@v4
        with:
          name: a2racer-macos-universal
          path: a2racer-macos-universal.zip

  windows-mingw:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf
      - name: Build
        run: |
          cmake -S port -B port/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build port/build 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Report compiler errors
        if: failure()
        run: grep -E "error|warning|undefined reference|multiple definition" build.log | head -50 | sed 's/^/::error::/' || true
      - name: Package with its DLLs
        run: |
          mkdir -p dist/a2racer
          cp port/build/a2racer.exe port/README.md dist/a2racer/
          ldd port/build/a2racer.exe | awk '/ucrt64/ { print $3 }' | xargs -r cp -t dist/a2racer/
          (cd dist && zip -r ../a2racer-windows-x86_64.zip a2racer)
      - uses: actions/upload-artifact@v4
        with:
          name: a2racer-windows-x86_64
          path: a2racer-windows-x86_64.zip

  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        shell: pwsh
        run: vcpkg install sdl2:x64-windows sdl2-ttf:x64-windows
      - name: Build
        shell: bash
        run: |
          cmake -S port -B port/build -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build port/build --config Release 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Report compiler errors
        if: failure()
        shell: bash
        run: grep -E "error|warning|undefined reference|multiple definition" build.log | head -50 | sed 's/^/::error::/' || true

  # Every push to main replaces the "latest" pre-release with these builds, so they can
  # be downloaded without a GitHub account.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, macos, windows-mingw, windows-msvc]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the latest build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" \
            --notes "Automatic build of the port from ${GITHUB_SHA::7}. The game's data is not included: run it with --data pointing at the original A2 Racer CD (or a copy of its files). See README.md in each archive."
