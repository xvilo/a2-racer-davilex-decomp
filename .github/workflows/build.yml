name: build

on:
  push:
    branches: ['**']
    # A version tag builds the port and attaches the builds to the tag's release.
    tags: ['v*']
  pull_request:
  # A release made on GitHub (with a new tag, or a draft published later).
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Build this tag and attach the builds to its release (empty for an ordinary build)
        required: false
        default: ''

# The port is Rust (port/Cargo.toml). Release builds use the `static` feature: SDL2 is
# compiled from source and linked in, so the executables need nothing beyond the
# system (on Linux SDL opens X11/Wayland, the sound server and OpenGL at run time).

# Runs for the same tag (its push, its release, one started by hand) wait for each other.
concurrency:
  group: build-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # SDL 2.0's CMakeLists asks for CMake < 3.5, which CMake 4 (macOS and Windows runners)
  # refuses without this.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Dependencies (SDL's video, sound and input back ends)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libudev-dev libdbus-1-dev
      - name: Build
        working-directory: port
        run: |
          cargo build --release --features static 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Test
        working-directory: port
        run: cargo test --release --features static
      - name: Report compiler errors
        if: failure()
        run: grep -E "^(error|warning)" -A3 port/build.log | head -40 | sed 's/^/::error::/' || true
      - name: Package
        run: |
          ldd port/target/release/a2racer
          if ldd port/target/release/a2racer | grep -iE "sdl|freetype"; then echo "::error::links SDL dynamically"; exit 1; fi
          mkdir -p dist/a2racer
          cp port/target/release/a2racer port/README.md dist/a2racer/
          tar -C dist -czf a2racer-linux-x86_64.tar.gz a2racer
      - uses: actions/upload-artifact@v4
        with:
          name: a2racer-linux-x86_64
          path: a2racer-linux-x86_64.tar.gz

  macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Toolchains
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build (Apple Silicon and Intel)
        working-directory: port
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --features static --target $t 2>&1 | tee -a build.log
            [ ${PIPESTATUS[0]} -eq 0 ] || exit 1
          done
      - name: Report compiler errors
        if: failure()
        run: grep -E "^(error|warning)" -A3 port/build.log | head -40 | sed 's/^/::error::/' || true
      - name: Package (universal)
        run: |
          mkdir -p dist/a2racer
          lipo -create -output dist/a2racer/a2racer \
            port/target/aarch64-apple-darwin/release/a2racer port/target/x86_64-apple-darwin/release/a2racer
          otool -L dist/a2racer/a2racer
          if otool -L dist/a2racer/a2racer | grep -E "SDL|/opt/homebrew|/usr/local"; then echo "::error::links a non-system library"; exit 1; fi
          lipo -info dist/a2racer/a2racer
          cp port/README.md dist/a2racer/
          codesign --force --sign - dist/a2racer/a2racer
          (cd dist && zip -r ../a2racer-macos-universal.zip a2racer)
      - uses: actions/upload-artifact@v4
        with:
          name: a2racer-macos-universal
          path: a2racer-macos-universal.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build
        working-directory: port
        shell: bash
        run: |
          cargo build --release --features static 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Report compiler errors
        if: failure()
        shell: bash
        run: grep -E "^(error|warning)" -A3 port/build.log | head -40 | sed 's/^/::error::/' || true
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/a2racer
          cp port/target/release/a2racer.exe port/README.md dist/a2racer/
          (cd dist && 7z a -tzip ../a2racer-windows-x86_64.zip a2racer)
      - uses: actions/upload-artifact@v4
        with:
          name: a2racer-windows-x86_64
          path: a2racer-windows-x86_64.zip

  # Every push to main replaces the "latest" pre-release with these builds, so they can
  # be downloaded without a GitHub account. A version tag (pushed, made with a release,
  # or given to a run started by hand) gets its builds attached to its own release.
  release:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the builds to the tag's release
        if: env.TAG != ''
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
          fi
      - name: Publish the latest build
        if: env.TAG == ''
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" \
            --notes "Automatic build of the port from ${GITHUB_SHA::7}. The game's data is not included: run it with --data pointing at the original A2 Racer CD image (.bin/.iso) or a copy of its files. See README.md in each archive."
      # Version tags from before this job attached builds: the builds from the run that
      # built the tag's commit on main (older tags may be the C port, which this workflow
      # no longer builds), or, without one, a build of the tag started now.
      - name: Attach builds to earlier version tags without them
        if: env.TAG == ''
        run: |
          for tag in $(gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name' | grep '^v' || true); do
            assets=$(gh release view "$tag" --json assets --jq '.assets | length' 2> /dev/null || echo none)
            [ "$assets" = 0 ] || [ "$assets" = none ] || continue
            sha=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
            run=$(gh run list --workflow build.yml --commit "$sha" --status success --limit 20 \
              --json databaseId,event --jq '[.[] | select(.event == "push")][0].databaseId // empty')
            rm -rf "backfill/$tag"
            if [ -z "$run" ] || ! gh run download "$run" -D "backfill/$tag"; then
              echo "$tag: no builds of $sha to reuse, starting a build of the tag"
              gh workflow run build.yml --ref main -f tag="$tag"
              continue
            fi
            files=$(find "backfill/$tag" -type f \( -name '*.zip' -o -name '*.tar.gz' \))
            echo "$tag: attaching" $files "from run $run"
            if [ "$assets" = none ]; then
              gh release create "$tag" $files --verify-tag --title "$tag" --generate-notes
            else
              gh release upload "$tag" $files --clobber
            fi
          done
