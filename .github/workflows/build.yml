name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# The port is Rust (port/Cargo.toml). Release builds use the `static` feature: SDL2 is
# compiled from source and linked in, so the executables need nothing beyond the
# system (on Linux SDL opens X11/Wayland, the sound server and OpenGL at run time).

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (SDL's video, sound and input back ends)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libudev-dev libdbus-1-dev
      - name: Build
        working-directory: port
        run: |
          cargo build --release --features static 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Test
        working-directory: port
        run: cargo test --release --features static
      - name: Report compiler errors
        if: failure()
        run: grep -E "^(error|warning)" -A3 port/build.log | head -40 | sed 's/^/::error::/' || true
      - name: Package
        run: |
          ldd port/target/release/a2racer
          if ldd port/target/release/a2racer | grep -iE "sdl|freetype"; then echo "::error::links SDL dynamically"; exit 1; fi
          mkdir -p dist/a2racer
          cp port/target/release/a2racer port/README.md dist/a2racer/
          tar -C dist -czf a2racer-linux-x86_64.tar.gz a2racer
      - uses: actions/upload-artifact@v4
        with:
          name: a2racer-linux-x86_64
          path: a2racer-linux-x86_64.tar.gz

  macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build (Apple Silicon and Intel)
        working-directory: port
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --features static --target $t 2>&1 | tee -a build.log
            [ ${PIPESTATUS[0]} -eq 0 ] || exit 1
          done
      - name: Report compiler errors
        if: failure()
        run: grep -E "^(error|warning)" -A3 port/build.log | head -40 | sed 's/^/::error::/' || true
      - name: Package (universal)
        run: |
          mkdir -p dist/a2racer
          lipo -create -output dist/a2racer/a2racer \
            port/target/aarch64-apple-darwin/release/a2racer port/target/x86_64-apple-darwin/release/a2racer
          otool -L dist/a2racer/a2racer
          if otool -L dist/a2racer/a2racer | grep -E "SDL|/opt/homebrew|/usr/local"; then echo "::error::links a non-system library"; exit 1; fi
          lipo -info dist/a2racer/a2racer
          cp port/README.md dist/a2racer/
          codesign --force --sign - dist/a2racer/a2racer
          (cd dist && zip -r ../a2racer-macos-universal.zip a2racer)
      - uses: actions/upload-artifact@v4
        with:
          name: a2racer-macos-universal
          path: a2racer-macos-universal.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: port
        shell: bash
        run: |
          cargo build --release --features static 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Report compiler errors
        if: failure()
        shell: bash
        run: grep -E "^(error|warning)" -A3 port/build.log | head -40 | sed 's/^/::error::/' || true
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/a2racer
          cp port/target/release/a2racer.exe port/README.md dist/a2racer/
          (cd dist && 7z a -tzip ../a2racer-windows-x86_64.zip a2racer)
      - uses: actions/upload-artifact@v4
        with:
          name: a2racer-windows-x86_64
          path: a2racer-windows-x86_64.zip

  # Every push to main replaces the "latest" pre-release with these builds, so they can
  # be downloaded without a GitHub account. Off while the port moves from C to Rust:
  # the last release (from the C port) stays up until the Rust port runs the whole game.
  release:
    if: false
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the latest build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" \
            --notes "Automatic build of the port from ${GITHUB_SHA::7}. The game's data is not included: run it with --data pointing at the original A2 Racer CD image (.bin/.iso) or a copy of its files. See README.md in each archive."
